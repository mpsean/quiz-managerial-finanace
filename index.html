<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Managerial Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Caveat:wght@600;700&display=swap">
<style id="app-css">
:root{
  --paper:#F7F9FC; --surface:#FFFFFF; --ink:#1B2230; --muted:#5B6474; --line:#D6DDE8;
  --blue:#2447A8; --blue-soft:#E7EDFB; --on-blue:#FFFFFF;
  --red:#C4302B; --red-soft:#FBEAE9; --green:#1C7A4B; --green-soft:#E4F3EA;
  --amber:#9A5B00; --amber-soft:#FDF1DC; --overlay:rgba(20,26,38,.5);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11151D; --surface:#19202B; --ink:#E6EAF1; --muted:#9BA4B3; --line:#2D3544;
    --blue:#8FAAF5; --blue-soft:#1D2842; --on-blue:#0E1526;
    --red:#F08A84; --red-soft:#3A2020; --green:#72D3A0; --green-soft:#15301F;
    --amber:#F2B45A; --amber-soft:#35290F; --overlay:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11151D; --surface:#19202B; --ink:#E6EAF1; --muted:#9BA4B3; --line:#2D3544;
  --blue:#8FAAF5; --blue-soft:#1D2842; --on-blue:#0E1526;
  --red:#F08A84; --red-soft:#3A2020; --green:#72D3A0; --green-soft:#15301F;
  --amber:#F2B45A; --amber-soft:#35290F; --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 96px}
h1,h2,h3,h4{line-height:1.2;margin:0;font-weight:700}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.hint{color:var(--muted);font-size:15px}

.btn{appearance:none;font:inherit;font-weight:700;font-size:15px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:8px;line-height:1.3}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:14px 30px;font-size:18px}
.btn.link{border-color:transparent;background:transparent;color:var(--blue);padding:4px 6px}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}

input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
input[type=number]{width:96px}
textarea{resize:vertical;min-height:150px;font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.65}
input:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
input[type=checkbox],input[type=radio]{accent-color:var(--blue);width:18px;height:18px;margin:0;flex:none}

.notice{padding:12px 14px;border-radius:8px;font-size:15px;margin-top:14px}
.notice.ok{background:var(--green-soft);color:var(--green)}
.notice.err{background:var(--red-soft);color:var(--red)}
.notice ul{margin:6px 0 0;padding-left:20px}

/* Teacher bar */
.ownerbar{background:var(--blue-soft);border-bottom:1px solid var(--line)}
.ownerbar-in{max-width:760px;margin:0 auto;padding:8px 20px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.ownerbar-label{font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:4px}
.tab{appearance:none;font:inherit;font-size:15px;font-weight:700;border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:6px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--blue)}

/* Builder */
.b-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.b-head h1{font-size:30px}
.pill{font-size:14px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--ink)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.b-sec{padding:26px 0;border-top:1px solid var(--line)}
.b-sec:first-of-type{border-top:0}
.b-sec h2{font-size:21px;margin-bottom:6px}
.field-label{display:block;font-weight:700;margin-bottom:6px}
.drop{margin-top:14px;border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop .btn{margin-bottom:6px}
details.fmt{margin-top:14px;font-size:15px}
details.fmt summary{cursor:pointer;color:var(--blue);font-weight:700}
.fmt-table{overflow-x:auto;margin-top:10px}
.fmt-table table{border-collapse:collapse;width:100%;min-width:520px}
.fmt-table th,.fmt-table td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--line)}
.fmt-table code,pre{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px}
pre{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;margin:10px 0 0;white-space:pre}
.qlist-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:20px 0 6px}
.qrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.qrow input{margin-top:4px}
.qrow.off .qrow-body{opacity:.5}
.qrow-text{font-family:"Source Serif 4",Georgia,serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qrow-ans{font-size:14px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.qrow-pts{font-size:14px;color:var(--muted);white-space:nowrap}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:4px;margin-right:6px;vertical-align:2px}
.badge.mc{background:var(--blue-soft);color:var(--blue)}
.badge.written{background:var(--amber-soft);color:var(--amber)}
.empty{padding:22px 0;color:var(--muted)}
.setting{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0}
.setting label{display:flex;gap:8px;align-items:center;cursor:pointer}
.setting .sub{padding-left:28px}
.libr{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.libr input{font-size:15px;padding:8px 10px}
@media (max-width:620px){.libr{grid-template-columns:1fr auto}.libr input:nth-child(3){grid-column:1 / -1}}
.b-sec code{background:var(--blue-soft);color:var(--blue);padding:1px 5px;border-radius:4px}
.publishbar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);margin:0 -20px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* Start screen */
.start{padding-top:64px}
.exam-title{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:clamp(32px,6vw,46px);line-height:1.1;letter-spacing:-.01em}
.facts{display:flex;flex-wrap:wrap;gap:12px 40px;margin:28px 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts dt{font-size:14px;color:var(--muted)}
.facts dd{margin:0;font-size:24px;font-weight:700}
.rules{margin:0 0 32px;padding-left:20px;color:var(--muted)}
.rules li{margin:4px 0}

/* Exam */
.examhead{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.examhead-in{max-width:760px;margin:0 auto;padding:10px 20px 8px;display:flex;align-items:center;gap:16px}
.eh-title{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;padding:0 10px;border-radius:8px;line-height:1.3}
.timer.none{font-size:15px;color:var(--muted);font-weight:400}
.timer.warn{color:var(--amber);background:var(--amber-soft)}
.timer.danger{color:var(--red);background:var(--red-soft)}
.eh-right{display:flex;align-items:center;gap:12px}
.progress{font-size:14px;color:var(--muted);white-space:nowrap}
.chips{max-width:760px;margin:0 auto;padding:0 20px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.chip{appearance:none;flex:none;font:inherit;font-size:14px;font-weight:700;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;position:relative;font-variant-numeric:tabular-nums}
.chip.done{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.chip.flag::after{content:"";position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--amber);border:2px solid var(--paper)}
@media (max-width:560px){
  .examhead-in{flex-wrap:wrap;gap:8px 12px}
  .eh-title{flex-basis:100%}
  .timer{font-size:24px;padding:0 6px}
  .eh-right{margin-left:auto}
}

.q{padding:30px 0;border-top:1px solid var(--line);scroll-margin-top:120px}
.q:first-child{border-top:0}
.q-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.q-num{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--blue);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:15px}
.q-meta{flex:1;font-size:14px;color:var(--muted)}
.flagbtn{appearance:none;font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--muted);padding:4px 10px;border-radius:99px;cursor:pointer}
.flagbtn[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.q-text{font-family:"Source Serif 4",Georgia,serif;font-size:20px;line-height:1.5;white-space:pre-wrap;margin-bottom:16px;overflow-wrap:anywhere}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.opt:hover{border-color:var(--blue)}
.opt:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:focus-visible){outline:3px solid var(--blue);outline-offset:2px}
.letter{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted)}
.opt:has(input:checked) .letter{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.opt-text{overflow-wrap:anywhere}
.wc{font-size:14px;color:var(--muted);margin-top:6px;text-align:right}
.endbar{border-top:1px solid var(--line);padding-top:28px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* Results */
.scorecard{padding:24px 0 30px;border-bottom:1px solid var(--line)}
.scorecard-top{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.mark{font-family:"Caveat","Segoe Print","Bradley Hand",cursive;color:var(--red);font-weight:700;line-height:.9}
.score-big{font-size:104px;transform:rotate(-4deg);white-space:nowrap}
.score-big .of{font-size:56px}
.pct{font-size:22px;font-weight:700}
.score-note{color:var(--muted);margin-top:2px}
.breakdown{display:flex;flex-wrap:wrap;gap:8px 32px;margin:22px 0}
.breakdown dt{font-size:14px;color:var(--muted)}
.breakdown dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.review-mark{font-size:40px;min-width:40px;text-align:center}
.opt.static{cursor:default}
.opt.static:hover{border-color:var(--line)}
.opt.is-correct{border-color:var(--green);background:var(--green-soft)}
.opt.is-correct .letter{background:var(--green);border-color:var(--green);color:var(--surface)}
.opt.is-wrong{border-color:var(--red);background:var(--red-soft)}
.opt.is-wrong .letter{background:var(--red);border-color:var(--red);color:var(--surface)}
.opt-tag{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
.is-correct .opt-tag{color:var(--green)}
.is-wrong .opt-tag{color:var(--red)}
.unanswered{font-size:14px;font-weight:700;color:var(--red);margin-bottom:8px}
.block{margin-top:16px}
.block h3{font-size:15px;color:var(--muted);margin-bottom:6px}
.block-body{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.block-body.serif{font-family:"Source Serif 4",Georgia,serif}
.block-body.model{border-left:4px solid var(--green)}
.block-body.criteria{border-left:4px solid var(--amber)}
.block-body.none{color:var(--muted);font-style:italic}
.selfscore{margin-top:18px;padding:14px;border-radius:10px;background:var(--blue-soft);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.selfscore label{display:flex;align-items:center;gap:8px;font-weight:700}
.quick{display:flex;gap:6px}
.quick .btn{padding:5px 12px;font-size:14px}

/* Modal */
.overlay{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;padding:24px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h2{font-size:22px;margin-bottom:10px}
.modal p{color:var(--muted);margin-bottom:22px}
</style>
</head>

function $(s, r){ return (r || document).querySelector(s); }

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function hash(str){ var h = 5381; for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function fmtClock(ms){
  var s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  var pad = function(n){ return (n < 10 ? '0' : '') + n; };
  return h ? h + ':' + pad(m) + ':' + pad(x) : pad(m) + ':' + pad(x);
}
function enc(obj){
  var b = new TextEncoder().encode(JSON.stringify(obj)), s = '';
  for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return btoa(s).split('').reverse().join('');
}
function dec(str){
  try {
    var s = atob(String(str).split('').reverse().join('')), b = new Uint8Array(s.length);

  } catch (e) { return {}; }

/* ---------- CSV ---------- */
function csvRows(text){
  text = text.replace(/^\uFEFF/, '');
  var first = text.split('\n')[0] || '';
  var d = first.indexOf(',') >= 0 ? ',' : first.indexOf(';') >= 0 ? ';' : first.indexOf('\t') >= 0 ? '\t' : ',';
  var rows = [], row = [], f = '', q = false, i = 0;
  while (i < text.length){
    var ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i + 1] === '"'){ f += '"'; i += 2; continue; } q = false; i++; continue; }
      f += ch; i++; continue;
    }
    if (ch === '"'){ q = true; i++; continue; }
    if (ch === d){ row.push(f); f = ''; i++; continue; }
    if (ch === '\r'){ i++; continue; }
    if (ch === '\n'){ row.push(f); rows.push(row); row = []; f = ''; i++; continue; }
    f += ch; i++;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return { rows: rows.filter(function(r){ return r.some(function(c){ return c.trim() !== ''; }); }), unclosed: q };
}

function parseCSV(text){
  var out = csvRows(text), errors = [], qs = [];
  if (out.unclosed) errors.push('A quoted field is never closed. Check for a missing " character.');
  if (!out.rows.length){ errors.push('The file is empty.'); return { qs: qs, errors: errors }; }
  var head = out.rows[0].map(function(h){ return h.trim().toLowerCase(); });
  var col = function(name){ return head.indexOf(name); };
  ['type', 'question', 'answer'].forEach(function(n){
    if (col(n) < 0) errors.push('Missing column "' + n + '". The first row must be the header: type, question, options, answer, grader, points.');
  });
  if (errors.length) return { qs: qs, errors: errors };
  out.rows.slice(1).forEach(function(r, i){
    var line = i + 2;
    var get = function(n){ var c = col(n); return c < 0 ? '' : String(r[c] == null ? '' : r[c]).trim(); };
    var t = get('type').toLowerCase(), q = get('question'), ans = get('answer'), grader = get('grader');
    var ptsRaw = get('points'), pts = ptsRaw === '' ? 1 : Number(ptsRaw);
    var type = ['mc','multiple choice','multiple-choice','multiple_choice','choice','mcq'].indexOf(t) >= 0 ? 'mc'
      : ['written','text','essay','short','short answer','open'].indexOf(t) >= 0 ? 'written' : null;
    if (!type){ errors.push('Row ' + line + ': type must be "mc" or "written" (found "' + get('type') + '").'); return; }
    if (!q){ errors.push('Row ' + line + ': the question is empty.'); return; }
    if (!(pts > 0)){ errors.push('Row ' + line + ': points must be a number above 0.'); return; }
    var id = 'q' + (qs.length + 1) + '_' + hash(q + '|' + line);
    if (type === 'mc'){
      var opts = get('options').split('|').map(function(s){ return s.trim(); }).filter(Boolean);
      if (opts.length < 2){ errors.push('Row ' + line + ': multiple choice needs at least 2 options separated by "|".'); return; }
      var c = -1;
      opts.forEach(function(o, k){ if (c < 0 && o.toLowerCase() === ans.toLowerCase()) c = k; });
      if (c < 0 && /^[a-z]$/i.test(ans)){ var n = LETTERS.indexOf(ans.toUpperCase()); if (n < opts.length) c = n; }
      if (c < 0){ errors.push('Row ' + line + ': the answer "' + ans + '" doesn\u2019t match any option. Use the option text or its letter (A, B, C\u2026).'); return; }
      qs.push({ id: id, type: 'mc', q: q, opts: opts, pts: pts, answer: c, grader: '', on: true });
    } else {
      if (!ans && !grader){ errors.push('Row ' + line + ': written questions need an answer, grading criteria, or both.'); return; }
      qs.push({ id: id, type: 'written', q: q, opts: [], pts: pts, answer: ans, grader: grader, on: true });
    }
  });
  if (!qs.length && !errors.length) errors.push('No questions found below the header row.');
  return { qs: qs, errors: errors };
}

function slugify(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60); }

}
function examFromDraft(d){
  var sel = d.questions.filter(function(q){ return q.on; });

  return {
    v: 1,
    title: (d.title || '').trim() || 'Untitled exam',
    timerMin: d.timerOn ? Math.max(1, Math.round(Number(d.timerMin) || 0)) : 0,
    perAttempt: d.randomOn && n > 0 && n < sel.length ? n : 0,
    shuffleQ: !!d.shuffleQ,
    shuffleOpt: !!d.shuffleOpt,
    site: { title: (d.siteTitle || '').trim(), slug: slugify(d.slug), library: (d.library || []).map(function(e){ return { title: (e.title || '').trim(), href: (e.href || '').trim(), note: (e.note || '').trim() }; }) },
    questions: sel.map(function(q){
      var o = { id: q.id, type: q.type, q: q.q };
      if (q.type === 'mc') o.opts = q.opts;
      o.pts = q.pts;
      o.k = enc(q.type === 'mc' ? { c: q.answer } : { m: q.answer, g: q.grader });
      return o;
    })

function download(filename, text){

  return Promise.resolve(fallbackDownload(filename, text));
}
function fallbackDownload(filename, text){
  try {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
    a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return true;
  } catch (e) { return false; }

function refreshBuilderMeta(){

  var pts = sel.reduce(function(s, q){ return s + q.pts; }, 0);
  var data = examFromDraft(d), dirty = JSON.stringify(data) !== EXAM_JSON;
  var st = $('#b-status');
  if (st && STANDALONE){ st.className = 'pill'; st.textContent = d.questions.length ? plural(sel.length, 'question') + ' ready' : 'No questions yet'; }
  else if (st){
    st.className = 'pill ' + (!EXAM ? '' : dirty ? 'warn' : 'ok');
    st.textContent = !EXAM ? 'Not published' : dirty ? 'Unpublished changes' : 'Published';
  }
  var c = $('#b-count'); if (c) c.textContent = sel.length + ' of ' + d.questions.length + ' selected, ' + fmtPts(pts) + ' points';
  var rn = $('#b-randomn'); if (rn) rn.max = Math.max(1, sel.length);

  var bf = $('#b-file'); if (bf) bf.textContent = live + '.html';
  var bp2 = $('#b-path2'); if (bp2) bp2.textContent = '/' + live + '/index.html';
  var bf2 = $('#b-file2'); if (bf2) bf2.textContent = live + '.html';
  var sm = $('#b-summary'), btn = $('#b-publish');
  var problem = !sel.length ? 'Select at least one question to publish.'
    : d.timerOn && !(Number(d.timerMin) >= 1) ? 'Set a time limit of at least 1 minute.'
    : d.randomOn && !(Number(d.randomN) >= 1) ? 'Set how many random questions each attempt gets.'
    : (!S.artifactNs && !STANDALONE) ? 'Publishing isn\u2019t available in this view.' : '';
  if (sm){
    var per = data.perAttempt || sel.length;
    sm.textContent = problem || (plural(per, 'question') + ' per attempt, ' + (data.timerMin ? data.timerMin + ' min limit' : 'no time limit') + '. Only selected questions are published.');
  }
  if (btn){
    btn.disabled = !!problem || S.publishing || (EXAM && !dirty);
    btn.textContent = S.publishing ? 'Publishing\u2026' : EXAM ? (dirty ? 'Publish changes' : 'Published') : 'Publish exam';

function loadCSVText(text, label){
  var r = parseCSV(text);
  S.csvErrors = r.errors;
  if (r.qs.length){
    S.draft.questions = r.qs;
    if (!S.draft.title.trim() && label) S.draft.title = label.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');
    if (S.draft.randomN > r.qs.length) S.draft.randomN = r.qs.length;
    S.notice = { kind: 'ok', text: 'Loaded ' + plural(r.qs.length, 'question') + (label ? ' from ' + label : '') + '.' };
  } else {
    S.notice = null;
  }
  render();
}
function readFile(file){
  if (!file) return;
  if (!/\.(csv|txt|tsv)$/i.test(file.name) && file.type && file.type.indexOf('csv') < 0 && file.type.indexOf('text') < 0){
    S.notice = { kind: 'err', text: file.name + ' isn\u2019t a CSV file. Save your sheet as CSV and upload it again.' }; S.csvErrors = []; render(); return;
  }
  file.text().then(function(t){ loadCSVText(t, file.name); }, function(){
    S.notice = { kind: 'err', text: 'Couldn\u2019t read ' + file.name + '. Try saving it again.' }; render();
  });
}
function downloadTemplate(){
  var d = S.downloadsNs;
  var fallback = function(){ var f = $('#fmt'); if (f){ f.open = true; f.scrollIntoView({ block: 'nearest' }); } };
  if (!d){ fallback(); return; }
  d.save({ filename: 'exam-template.csv', data: TEMPLATE }).catch(function(e){ if (!e || e.code !== 'declined') fallback(); });
}
function exportExam(){
  var d = S.draft, data = examFromDraft(d);
  if (!data.questions.length){ S.notice = { kind: 'err', text: 'Select at least one question first.' }; render(); return; }
  var slug = slugify(d.slug) || slugify(d.title) || 'exam';
  d.slug = slug;
  var href = '/' + slug;
  var entry = null;
  d.library.forEach(function(e){ if (slugify(e.href) === slug || (e.href || '').trim() === href) entry = e; });
  if (!entry){ entry = { title: '', href: href, note: '' }; d.library.push(entry); }
  if (!entry.title) entry.title = data.title;
  if (!entry.note) entry.note = plural(data.perAttempt || data.questions.length, 'question') + ', ' + (data.timerMin ? data.timerMin + ' minutes' : 'no time limit');
  download(slug + '.html', buildDoc(data)).then(function(ok){
    S.notice = ok ? { kind: 'ok', text: 'Downloaded ' + slug + '.html. Upload it to your server as ' + slug + '/index.html, then publish here to save the list.' }
      : { kind: 'err', text: 'The download was blocked. Open this page in a new tab and try again.' };
    render();
  });
}
function publish(){
  var data = examFromDraft(S.draft);
  if (!data.questions.length || !S.artifactNs) return;
  S.publishing = true; refreshBuilderMeta();
  S.artifactNs.publish(buildDoc(data)).then(function(){
    S.publishing = false;
    S.notice = { kind: 'ok', text: 'Published. Share this page\u2019s link with your students.' };
    render();
  }, function(e){
    S.publishing = false;
    var code = e && e.code, msg;
    if (code === 'conflict') msg = 'A newer version was published elsewhere. The page is reloading to it.';
    else if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed') { msg = 'This view can\u2019t publish. Open the exam from your own Claude account.'; S.artifactNs = null; }
    else if (code === 'too_large') msg = 'The exam is too large to publish. Remove some questions and try again.';
    else if (code === 'rate_limited') msg = 'Publishing too often. Wait a minute, then publish again.';
    else msg = 'Publishing failed' + (e && e.message ? ': ' + e.message : '.') + ' Try again.';
    S.notice = { kind: 'err', text: msg };
    render();
  });
}

/* ---------- Student ---------- */
function answered(id){
  var q = QBY[id], v = CUR.answers[id];
  return q.type === 'mc' ? v != null : !!(v && String(v).trim());
}
function newAttempt(){
  var ids = EXAM.questions.map(function(q){ return q.id; });
  if (EXAM.perAttempt > 0 && EXAM.perAttempt < ids.length){
    var pick = shuffle(ids).slice(0, EXAM.perAttempt);
    ids = ids.filter(function(id){ return pick.indexOf(id) >= 0; });
  }
  if (EXAM.shuffleQ) ids = shuffle(ids);
  var optOrder = {};
  ids.forEach(function(id){
    var q = QBY[id];
    if (q.type === 'mc'){ var o = q.opts.map(function(_, i){ return i; }); optOrder[id] = EXAM.shuffleOpt ? shuffle(o) : o; }
  });
  var now = Date.now();
  return { qs: ids, optOrder: optOrder, answers: {}, flags: {}, scores: {}, startedAt: now,
    endsAt: EXAM.timerMin > 0 ? now + EXAM.timerMin * 60000 : null, status: 'active', auto: false };
}

      '</p></main>';
  }
  CUR = store.get(ATTEMPT_KEY);
  if (CUR && (!Array.isArray(CUR.qs) || CUR.qs.some(function(id){ return !QBY[id]; }))) { store.del(ATTEMPT_KEY); CUR = null; }
  if (CUR && CUR.status === 'active' && CUR.endsAt && Date.now() >= CUR.endsAt){
    CUR.status = 'done'; CUR.auto = true; CUR.submittedAt = CUR.endsAt; save();
  }
  if (!CUR) return startHTML();
  if (CUR.status === 'active') return examHTML();
  return resultsHTML();
}

function startHTML(){
  var n = EXAM.perAttempt || EXAM.questions.length;
  var ptsSet = {}; EXAM.questions.forEach(function(q){ ptsSet[q.pts] = 1; });
  var same = Object.keys(ptsSet).length === 1;
  var total = EXAM.perAttempt ? (same ? n * EXAM.questions[0].pts : null) : EXAM.questions.reduce(function(s, q){ return s + q.pts; }, 0);
  var mc = EXAM.questions.some(function(q){ return q.type === 'mc'; }), wr = EXAM.questions.some(function(q){ return q.type === 'written'; });
  var h = '<main class="wrap start"><h1 class="exam-title">' + esc(EXAM.title) + '</h1>';
  h += '<dl class="facts"><div><dt>Questions</dt><dd>' + n + '</dd></div>' +
    '<div><dt>Points</dt><dd>' + (total == null ? 'Varies' : fmtPts(total)) + '</dd></div>' +
    '<div><dt>Time limit</dt><dd>' + (EXAM.timerMin ? EXAM.timerMin + ' min' : 'None') + '</dd></div></dl>';
  h += '<ul class="rules">' +
    (EXAM.timerMin ? '<li>The timer starts when you press Start, and the exam submits itself when time runs out.</li>' : '<li>Take as long as you need, then press Finish.</li>') +
    '<li>All questions are on one page. Flag any you want to come back to.</li>' +
    (mc ? '<li>Multiple choice answers are marked for you.</li>' : '') +
    (wr ? '<li>For written answers you\u2019ll see the model answer and criteria, then score yourself.</li>' : '') +
    '<li>You can retake the exam as many times as you like.</li></ul>';
  return h + '<button class="btn primary big" data-act="start">Start exam</button></main>';
}

function examHTML(){
  var total = CUR.qs.length;
  var h = '<div class="examhead"><div class="examhead-in"><div class="eh-title">' + esc(EXAM.title) + '</div>' +
    (CUR.endsAt ? '<div class="timer" id="timer" role="timer" aria-label="Time remaining">' + fmtClock(CUR.endsAt - Date.now()) + '</div>'
      : '<div class="timer none">No time limit</div>') +
    '<div class="eh-right"><span class="progress" id="progress"></span><button class="btn primary" data-act="finish">Finish</button></div></div>' +
    '<nav class="chips" id="chips" aria-label="Jump to question">' +
    CUR.qs.map(function(id, i){ return '<button class="chip" data-act="chip" data-id="' + id + '" aria-label="Question ' + (i + 1) + '">' + (i + 1) + '</button>'; }).join('') +
    '</nav></div><main class="wrap">';
  CUR.qs.forEach(function(id, i){
    var q = QBY[id], flagged = !!CUR.flags[id];
    h += '<article class="q" id="q-' + id + '"><div class="q-head"><span class="q-num" aria-hidden="true">' + (i + 1) + '</span>' +
      '<span class="q-meta">Question ' + (i + 1) + ' of ' + total + ', ' + (q.type === 'mc' ? 'multiple choice' : 'written') + ', ' + plural(Number(fmtPts(q.pts)), 'point') + '</span>' +
      '<button class="flagbtn" data-act="flag" data-id="' + id + '" aria-pressed="' + flagged + '">' + (flagged ? 'Flagged' : 'Flag') + '</button></div>' +
      '<div class="q-text" id="qt-' + id + '">' + esc(q.q) + '</div>';
    if (q.type === 'mc'){
      h += '<div class="opts" role="radiogroup" aria-labelledby="qt-' + id + '">';
      (CUR.optOrder[id] || []).forEach(function(oi, pos){
        h += '<label class="opt"><input type="radio" name="ans-' + id + '" data-mc="' + id + '" value="' + oi + '"' + (CUR.answers[id] === oi ? ' checked' : '') + '>' +
          '<span class="letter" aria-hidden="true">' + LETTERS[pos] + '</span><span class="opt-text">' + esc(q.opts[oi]) + '</span></label>';
      });
      h += '</div><div class="row end"><button class="btn link" data-act="clear" data-id="' + id + '" id="clr-' + id + '"' + (CUR.answers[id] == null ? ' hidden' : '') + '>Clear answer</button></div>';
    } else {
      var v = CUR.answers[id] || '';
      h += '<textarea data-wr="' + id + '" aria-labelledby="qt-' + id + '" placeholder="Write your answer here">' + esc(v) + '</textarea>' +
        '<div class="wc" id="wc-' + id + '">' + plural(wordCount(v), 'word') + '</div>';
    }
    h += '</article>';
  });
  h += '<div class="endbar"><span class="hint">Check your flagged questions before you finish.</span><button class="btn primary big" data-act="finish">Finish exam</button></div></main>';
  setTimeout(updateProgress, 0);
  return h;
}
function wordCount(s){ s = String(s || '').trim(); return s ? s.split(/\s+/).length : 0; }
function updateProgress(){
  if (!CUR) return;
  var done = 0;
  CUR.qs.forEach(function(id){
    var a = answered(id); if (a) done++;
    var chip = $('.chip[data-id="' + id + '"]');
    if (chip){
      chip.classList.toggle('done', a); chip.classList.toggle('flag', !!CUR.flags[id]);
      chip.setAttribute('aria-label', 'Question ' + (CUR.qs.indexOf(id) + 1) + (a ? ', answered' : ', not answered') + (CUR.flags[id] ? ', flagged' : ''));
    }
  });
  var p = $('#progress'); if (p) p.textContent = done + ' of ' + CUR.qs.length + ' answered';
}
function startTick(){
  stopTick();
  if (!CUR || !CUR.endsAt) return;
  var tick = function(){
    var left = CUR.endsAt - Date.now();
    if (left <= 0){ submit(true); return; }
    var el = $('#timer');
    if (el){ el.textContent = fmtClock(left); el.classList.toggle('warn', left <= 300000 && left > 60000); el.classList.toggle('danger', left <= 60000); }
    [5, 1].forEach(function(m){
      if (left <= m * 60000 && left > (m * 60000 - 3000) && !ANNOUNCED[m]){ ANNOUNCED[m] = 1; var l = $('#live'); if (l) l.textContent = plural(m, 'minute') + ' left.'; }
    });
  };
  tick(); TICK = setInterval(tick, 500);
}
function submit(auto){
  if (!CUR || CUR.status !== 'active') return;
  closeModal(false);
  CUR.status = 'done'; CUR.auto = !!auto;
  CUR.submittedAt = auto && CUR.endsAt ? Math.min(Date.now(), CUR.endsAt) : Date.now();
  save(); render(); window.scrollTo(0, 0);
  var l = $('#live'); if (l) l.textContent = auto ? 'Time is up. Your exam was submitted.' : 'Exam submitted.';
}
function confirmFinish(){
  var un = CUR.qs.filter(function(id){ return !answered(id); }).length;
  var fl = CUR.qs.filter(function(id){ return CUR.flags[id]; }).length;
  var body = (un ? plural(un, 'question') + (un === 1 ? ' is' : ' are') + ' still unanswered.' : 'Every question has an answer.') +
    (fl ? ' ' + plural(fl, 'question') + (fl === 1 ? ' is' : ' are') + ' flagged.' : '') + ' You can\u2019t change answers after submitting.';
  modal({ title: 'Submit your exam?', body: body, ok: 'Submit exam', cancel: 'Keep working' }).then(function(ok){ if (ok) submit(false); });
}

/* ---------- Results ---------- */
function tally(){
  var t = { mc: 0, mcMax: 0, mcRight: 0, mcCount: 0, wr: 0, wrMax: 0, wrScored: 0, wrCount: 0 };
  CUR.qs.forEach(function(id){
    var q = QBY[id];
    if (q.type === 'mc'){ t.mcMax += q.pts; t.mcCount++; if (CUR.answers[id] === KEYS[id].c){ t.mc += q.pts; t.mcRight++; } }
    else { t.wrMax += q.pts; t.wrCount++; if (CUR.scores[id] != null){ t.wr += CUR.scores[id]; t.wrScored++; } }
  });
  t.total = t.mc + t.wr; t.max = t.mcMax + t.wrMax;
  return t;
}
function resultsHTML(){
  var h = '<main class="wrap"><section class="scorecard"><h1 class="exam-title" style="font-size:30px">' + esc(EXAM.title) + '</h1>';
  if (CUR.auto) h += '<div class="notice err">Time ran out, so your exam was submitted automatically.</div>';
  h += '<div class="scorecard-top" style="margin-top:18px"><div class="mark score-big" aria-hidden="true"><span id="r-score"></span><span class="of" id="r-max"></span></div>' +
    '<div><div class="pct" id="r-pct"></div><p class="score-note" id="r-note"></p></div></div>' +
    '<dl class="breakdown">' +
    (hasType('mc') ? '<div><dt>Multiple choice</dt><dd id="r-mc"></dd></div>' : '') +
    (hasType('written') ? '<div><dt>Written (self-scored)</dt><dd id="r-wr"></dd></div>' : '') +
    '<div><dt>Time used</dt><dd>' + fmtClock((CUR.submittedAt || Date.now()) - CUR.startedAt) + '</dd></div></dl>' +
    '<button class="btn" data-act="retake">Retake exam</button></section>';

  CUR.qs.forEach(function(id, i){
    var q = QBY[id], k = KEYS[id], a = CUR.answers[id];
    h += '<article class="q" id="q-' + id + '"><div class="q-head"><span class="q-num" aria-hidden="true">' + (i + 1) + '</span>' +
      '<span class="q-meta">Question ' + (i + 1) + ', ' + (q.type === 'mc' ? 'multiple choice' : 'written') + ', ' + plural(Number(fmtPts(q.pts)), 'point') + '</span>';
    if (q.type === 'mc'){
      var right = a === k.c;
      h += '<span class="mark review-mark" aria-label="' + (right ? 'Correct' : 'Incorrect') + '">' + (right ? '\u2713' : '\u2717') + '</span></div>';
      h += '<div class="q-text">' + esc(q.q) + '</div>';
      if (a == null) h += '<div class="unanswered">Not answered</div>';
      h += '<div class="opts">';
      (CUR.optOrder[id] || []).forEach(function(oi, pos){
        var cls = oi === k.c ? ' is-correct' : (oi === a ? ' is-wrong' : '');
        var tag = oi === k.c ? (oi === a ? 'Your answer, correct' : 'Correct answer') : (oi === a ? 'Your answer' : '');
        h += '<div class="opt static' + cls + '"><span class="letter" aria-hidden="true">' + LETTERS[pos] + '</span><span class="opt-text">' + esc(q.opts[oi]) + '</span>' +
          (tag ? '<span class="opt-tag">' + tag + '</span>' : '') + '</div>';
      });
      h += '</div>';
    } else {
      h += '<span class="mark review-mark" id="wm-' + id + '"></span></div>';
      h += '<div class="q-text">' + esc(q.q) + '</div>';
      h += '<div class="block"><h3>Your answer</h3><div class="block-body serif' + (a && String(a).trim() ? '' : ' none') + '">' + (a && String(a).trim() ? esc(a) : 'Not answered') + '</div></div>';
      if (k.m) h += '<div class="block"><h3>Model answer</h3><div class="block-body serif model">' + esc(k.m) + '</div></div>';
      if (k.g) h += '<div class="block"><h3>Grading criteria</h3><div class="block-body criteria">' + esc(k.g) + '</div></div>';
      var sv = CUR.scores[id];
      h += '<div class="selfscore"><label>Your score <input type="number" data-score="' + id + '" min="0" max="' + q.pts + '" step="0.5" value="' + (sv == null ? '' : sv) + '" placeholder="\u2013"> of ' + fmtPts(q.pts) + '</label>' +
        '<div class="quick"><button class="btn" data-act="quick" data-id="' + id + '" data-v="0">0</button>' +
        (q.pts > 1 ? '<button class="btn" data-act="quick" data-id="' + id + '" data-v="' + (Math.round(q.pts) / 2) + '">Half</button>' : '') +
        '<button class="btn" data-act="quick" data-id="' + id + '" data-v="' + q.pts + '">Full</button></div></div>';
    }
    h += '</article>';
  });
  h += '<div class="endbar"><span class="hint">Your results stay on this device.</span><button class="btn primary" data-act="retake">Retake exam</button></div></main>';
  setTimeout(updateTally, 0);
  return h;
}
function hasType(t){ return CUR.qs.some(function(id){ return QBY[id].type === t; }); }
function updateTally(){
  if (!CUR || CUR.status !== 'done') return;
  var t = tally(), set = function(sel, txt){ var e = $(sel); if (e) e.textContent = txt; };
  set('#r-score', fmtPts(t.total)); set('#r-max', '/' + fmtPts(t.max));
  set('#r-pct', (t.max ? Math.round(t.total / t.max * 100) : 0) + '%' + (t.wrScored < t.wrCount ? ' so far' : ''));
  set('#r-note', t.wrScored < t.wrCount
    ? 'Score ' + plural(t.wrCount - t.wrScored, 'more written answer') + ' below to complete your total.'
    : 'Your final score is ' + fmtPts(t.total) + ' out of ' + fmtPts(t.max) + '.');
  set('#r-mc', t.mcRight + ' of ' + t.mcCount + ' correct, ' + fmtPts(t.mc) + '/' + fmtPts(t.mcMax) + ' pts');
  set('#r-wr', t.wrScored + ' of ' + t.wrCount + ' scored, ' + fmtPts(t.wr) + '/' + fmtPts(t.wrMax) + ' pts');
  var sc = $('.score-big'); if (sc) sc.setAttribute('aria-label', 'Score ' + fmtPts(t.total) + ' out of ' + fmtPts(t.max));
  CUR.qs.forEach(function(id){
    if (QBY[id].type !== 'written') return;
    var m = $('#wm-' + id); if (m) m.textContent = CUR.scores[id] == null ? '' : fmtPts(CUR.scores[id]) + '/' + fmtPts(QBY[id].pts);
  });
}
function setScore(id, raw, writeBack){
  var q = QBY[id], v = parseFloat(raw);
  if (raw === '' || isNaN(v)) delete CUR.scores[id];
  else {
    var c = Math.min(q.pts, Math.max(0, v));
    CUR.scores[id] = Math.round(c * 100) / 100;
    if (writeBack || c !== v){ var inp = $('input[data-score="' + id + '"]'); if (inp) inp.value = CUR.scores[id]; }
  }
  save(); updateTally();
}

/* ---------- Modal ---------- */
var modalResolve = null, modalReturn = null;
function modal(o){
  closeModal(false);
  modalReturn = document.activeElement;
  var d = document.createElement('div');
  d.className = 'overlay';
  d.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-t" aria-describedby="m-b"><h2 id="m-t">' + esc(o.title) + '</h2><p id="m-b">' + esc(o.body) + '</p>' +
    '<div class="row end"><button class="btn" data-m="0">' + esc(o.cancel) + '</button><button class="btn primary" data-m="1">' + esc(o.ok) + '</button></div></div>';
  document.body.appendChild(d);
  d.querySelector('[data-m="1"]').focus();
  d.addEventListener('click', function(e){
    var b = e.target.closest('[data-m]');
    if (b) closeModal(b.getAttribute('data-m') === '1');
    else if (e.target === d) closeModal(false);
  });
  return new Promise(function(res){ modalResolve = res; });
}
function closeModal(v){
  var d = $('.overlay'); if (d) d.remove();
  if (modalResolve){ var r = modalResolve; modalResolve = null; r(!!v); if (modalReturn && modalReturn.focus && document.contains(modalReturn)) modalReturn.focus(); }
}

/* ---------- Events ---------- */
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeModal(false);
  if (e.key === 'Tab' && $('.overlay')){
    var btns = $$('.overlay button'), i = btns.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0){ e.preventDefault(); btns[btns.length - 1].focus(); }
    else if (!e.shiftKey && i === btns.length - 1){ e.preventDefault(); btns[0].focus(); }
  }
});
app.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if (!el) return;
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
  switch (act){
    case 'tab': S.tab = el.getAttribute('data-tab'); S.notice = null; render(); break;
    case 'pick-file': var f = $('#file'); if (f) f.click(); break;
    case 'template': downloadTemplate(); break;
    case 'sample': loadCSVText(TEMPLATE, 'sample questions'); break;
    case 'sel-all': case 'sel-none':
      S.draft.questions.forEach(function(q){ q.on = act === 'sel-all'; }); render(); break;
    case 'publish': publish(); break;
    case 'export-exam': exportExam(); break;
    case 'export-json':
      download('exams.json', JSON.stringify(libRows(S.draft), null, 2)).then(function(ok){
        S.notice = ok ? { kind: 'ok', text: 'Downloaded exams.json. Upload it to the root of your site, replacing the old one.' }
          : { kind: 'err', text: 'The download was blocked. Open this page in a new tab and try again.' };
        render();
      });
      break;
    case 'export-site':
      download('home.html', buildHome(S.draft)).then(function(){
        return download('exams.html', buildList(S.draft));
      }).then(function(ok){
        S.notice = ok ? { kind: 'ok', text: 'Downloaded home.html and exams.html. Upload them as /index.html and /exams/index.html.' }
          : { kind: 'err', text: 'The download was blocked. Open this page in a new tab and try again.' };
        render();
      });
      break;
    case 'lib-add': S.draft.library.push({ title: '', href: '', note: '' }); render(); break;
    case 'lib-del': S.draft.library.splice(+el.getAttribute('data-i'), 1); render(); break;
    case 'start': CUR = newAttempt(); ANNOUNCED = {}; save(); render(); window.scrollTo(0, 0); break;
    case 'chip': var t = document.getElementById('q-' + id); if (t){ t.scrollIntoView({ block: 'start' }); var inp = t.querySelector('input,textarea'); if (inp) inp.focus({ preventScroll: true }); } break;
    case 'flag':
      if (CUR.flags[id]) delete CUR.flags[id]; else CUR.flags[id] = 1;
      el.setAttribute('aria-pressed', String(!!CUR.flags[id])); el.textContent = CUR.flags[id] ? 'Flagged' : 'Flag';
      save(); updateProgress(); break;
    case 'clear':
      delete CUR.answers[id]; $$('input[data-mc="' + id + '"]').forEach(function(r){ r.checked = false; });
      el.hidden = true; save(); updateProgress(); break;
    case 'finish': confirmFinish(); break;
    case 'retake':
      modal({ title: 'Retake the exam?', body: 'Your current results will be cleared and a new attempt will start from the beginning.', ok: 'Retake exam', cancel: 'Keep results' })
        .then(function(ok){ if (!ok) return; store.del(ATTEMPT_KEY); CUR = null; render(); window.scrollTo(0, 0); });
      break;
    case 'quick': setScore(id, el.getAttribute('data-v'), true); break;
  }
});
app.addEventListener('change', function(e){
  var el = e.target, d = S.draft;
  if (el.id === 'file'){ readFile(el.files && el.files[0]); el.value = ''; return; }
  if (el.hasAttribute('data-sel')){ d.questions[+el.getAttribute('data-sel')].on = el.checked; el.closest('.qrow').classList.toggle('off', !el.checked); refreshBuilderMeta(); return; }
  if (el.id === 'b-timer-on'){ d.timerOn = el.checked; $('#b-timer').disabled = !el.checked; refreshBuilderMeta(); return; }
  if (el.name === 'b-mode'){ d.randomOn = el.value === 'random'; $('#b-randomn').disabled = !d.randomOn; refreshBuilderMeta(); return; }
  if (el.id === 'b-shuffleq'){ d.shuffleQ = el.checked; refreshBuilderMeta(); return; }
  if (el.id === 'b-shuffleo'){ d.shuffleOpt = el.checked; refreshBuilderMeta(); return; }
  if (el.hasAttribute('data-mc')){
    var id = el.getAttribute('data-mc'); CUR.answers[id] = Number(el.value);
    var c = document.getElementById('clr-' + id); if (c) c.hidden = false;
    save(); updateProgress(); return;
  }
  if (el.hasAttribute('data-score')) setScore(el.getAttribute('data-score'), el.value, true);
});
app.addEventListener('input', function(e){
  var el = e.target, d = S.draft;
  if (el.id === 'b-title'){ d.title = el.value; refreshBuilderMeta(); return; }
  if (el.id === 'b-timer'){ d.timerMin = el.value; refreshBuilderMeta(); return; }
  if (el.id === 'b-randomn'){ d.randomN = el.value; refreshBuilderMeta(); return; }
  if (el.id === 'b-slug'){ d.slug = el.value; refreshBuilderMeta(); return; }
  if (el.id === 'b-site'){ d.siteTitle = el.value; refreshBuilderMeta(); return; }
  if (el.hasAttribute('data-lib')){ d.library[+el.getAttribute('data-i')][el.getAttribute('data-lib')] = el.value; refreshBuilderMeta(); return; }
  if (el.hasAttribute('data-wr')){
    var id = el.getAttribute('data-wr'); CUR.answers[id] = el.value;
    var wc = document.getElementById('wc-' + id); if (wc) wc.textContent = plural(wordCount(el.value), 'word');
    save(); updateProgress(); return;
  }
  if (el.hasAttribute('data-score')) setScore(el.getAttribute('data-score'), el.value, false);
});
app.addEventListener('dragover', function(e){ var dz = e.target.closest && e.target.closest('#drop'); if (dz){ e.preventDefault(); dz.classList.add('over'); } });
app.addEventListener('dragleave', function(e){ var dz = e.target.closest && e.target.closest('#drop'); if (dz) dz.classList.remove('over'); });
app.addEventListener('drop', function(e){
  var dz = e.target.closest && e.target.closest('#drop'); if (!dz) return;
  e.preventDefault(); dz.classList.remove('over');
  readFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
});

/* ---------- Boot ---------- */
var STANDALONE = !(window.claude && typeof window.claude.use === 'function');
var DRAFT_KEY = 'exam-builder-draft';
render();
if (STANDALONE && !EXAM){
  S.role = 'owner';
  var saved = store.get(DRAFT_KEY);
  S.draft = saved && Array.isArray(saved.questions) ? saved : draftFromExam();
  render();
}
(function(){
  var c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  c.use('downloads').then(function(d){ S.downloadsNs = d; }, function(){});
  c.use('user').then(function(user){
    if (!user) return;
    return Promise.all([user.isOwner(), user.canEdit()]).then(function(r){
      if (!(r[0] || r[1])) return;
      return c.use('artifact').then(function(art){
        S.role = 'owner'; S.artifactNs = art; S.draft = draftFromExam(); S.tab = 'builder';
        render();
      });
    });
  }).catch(function(){});
})();
})();
</script>
</body>
